<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Engine Test Client</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; background: #f8f9fa; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .log-container { background: #1e1e1e; color: #00ff00; padding: 1rem; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; }
        .btn { background: #007bff; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { background: #0056b3; }
        h1, h2 { margin-top: 0; color: #333; }
        .status { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Chart Engine Data Pipeline Test</h1>
        <p>Use this tool to upload your 1M+ row datasets directly to the backend and monitor the live progress via <strong>Server-Sent Events (SSE)</strong>.</p>
        
        <input type="file" id="fileInput" accept=".csv" />
        <button id="uploadBtn" class="btn">Upload Dataset</button>
        
        <div id="uploadStatus" class="status"></div>
    </div>

    <div class="card">
        <h2>Live Processing Logs (SSE Stream)</h2>
        <div id="logOutput" class="log-container">
            <div>Ready to stream logs...</div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:5110";

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const logOutput = document.getElementById('logOutput');
        const uploadStatus = document.getElementById('uploadStatus');

        function appendLog(message, isError = false) {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            if (isError) div.style.color = '#ff4444';
            logOutput.appendChild(div);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        async function processStream(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                buffer += decoder.decode(value, { stream: true });
                
                // Parse lines
                const lines = buffer.split('\n');
                buffer = lines.pop(); // Keep the last incomplete line in buffer
                
                for (let line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.substring(6).trim();
                        if (!jsonStr) continue;
                        
                        try {
                            const data = JSON.parse(jsonStr);
                            
                            // Check for completion response
                            if (data.datasetId) {
                                appendLog(`[SUCCESS] Dataset ${data.datasetId} processed successfully!`);
                                appendLog(`Total Rows: ${data.totalRows}`);
                                appendLog(`Dimensions: ${data.dimensions}`);
                                appendLog(`Metrics: ${data.metrics}`);
                                uploadStatus.textContent = "Upload and Processing Complete!";
                            } 
                            // Otherwise it's a progress event
                            else if (data.percent !== undefined) {
                                appendLog(`[PROGRESS] ${data.percent}% - ${data.message}`);
                            }
                        } catch (e) {
                            console.error("Failed to parse chunk", jsonStr, e);
                        }
                    }
                }
            }
        }

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file first.");
                return;
            }

            uploadBtn.disabled = true;
            uploadStatus.textContent = `Uploading ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)...`;
            appendLog(`Starting upload for ${file.name}...`);
            appendLog(`Establishing SSE connection...`);

            const formData = new FormData();
            formData.append('file', file);

            try {
                // We use fetch instead of EventSource because we need to send a POST with FormData
                const response = await fetch(`${API_BASE}/api/v1/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Upload failed with status ${response.status}`);
                }

                // Process the Server-Sent Events stream from the response body
                await processStream(response);

            } catch (err) {
                uploadStatus.textContent = `Upload Error!`;
                uploadStatus.style.color = 'red';
                appendLog(err.toString(), true);
            } finally {
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
